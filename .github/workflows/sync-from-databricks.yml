name: Sync Notebooks from Databricks to GitHub
on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Mensaje del commit'
        required: false
        default: 'sync: actualizar notebooks desde Databricks'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install jq & curl
      run: sudo apt-get update && sudo apt-get install -y jq curl

    - name: Export notebooks from Databricks
      run: |
        ORIGIN_HOST=${{ secrets.DATABRICKS_ORIGIN_HOST }}
        ORIGIN_TOKEN=${{ secrets.DATABRICKS_ORIGIN_TOKEN }}
        NOTEBOOK_BASE="/Workspace/Users/jorgee@osom.biz/ProyectoDatabricks/proceso"
        NOTEBOOKS=("1.Preparacion_Ambiente" "2.Ingest_circuits_data" "2.Ingest_Constructors" "2.Ingest_racing_data" "3.Transform" "4.Load" "5.Grants_Medallion")
        
        mkdir -p proceso
        
        echo "📥 Exportando notebooks desde Databricks..."
        export_errors=0
        for nb in "${NOTEBOOKS[@]}"; do
          echo "  Exportando: $nb"
          http_code=$(curl -s -o "proceso/$nb.py" -w "%{http_code}" -X GET \
            -H "Authorization: Bearer $ORIGIN_TOKEN" \
            "$ORIGIN_HOST/api/2.0/workspace/export?path=$NOTEBOOK_BASE/$nb&format=SOURCE&direct_download=true")
          
          if [ "$http_code" != "200" ]; then
            echo "  ⚠️  No se pudo exportar $nb (HTTP $http_code) - puede que no exista aún"
            rm -f "proceso/$nb.py"
            export_errors=$((export_errors + 1))
          else
            file_size=$(stat -c%s "proceso/$nb.py" 2>/dev/null || echo "0")
            echo "  ✅ $nb exportado ($file_size bytes)"
          fi
        done
        
        echo ""
        echo "📋 Notebooks exportados:"
        ls -la proceso/
        
        if [ $export_errors -eq ${#NOTEBOOKS[@]} ]; then
          echo "❌ No se pudo exportar ningún notebook"
          exit 1
        fi

    - name: Commit and Push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        git add proceso/
        
        if git diff --cached --quiet; then
          echo "ℹ️  No hay cambios que sincronizar. Los notebooks están actualizados."
        else
          echo "📝 Cambios detectados:"
          git diff --cached --stat
          git commit -m "${{ github.event.inputs.commit_message }}"
          git push
          echo "✅ Cambios sincronizados exitosamente a GitHub"
        fi
